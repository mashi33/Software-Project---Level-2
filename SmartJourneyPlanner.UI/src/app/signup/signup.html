<div class="login-wrapper">
  <div class="bg-overlay"></div>

  <div class="login-card signup-card">
    <div class="brand-header">
      <span class="logo-text">SJP</span>
      <h2>Begin Your Adventure</h2>
      <p class="subtitle">Fill in your details to get started</p>
    </div>

    <div class="login-form">

      <div class="input-group">
        <label>User Name</label>
        <div class="input-field">
          <i class="bi bi-person input-icon"></i>
          <input type="text" name="FullName" [(ngModel)]="signupData.FullName" placeholder="Enter your username"
            required />
        </div>
      </div>

      <div class="input-group">
        <label>Email Address</label>
        <div class="input-field">
          <i class="bi bi-envelope input-icon"></i>
          <input type="email" name="Email" [(ngModel)]="signupData.Email" placeholder="Enter your email" required />
        </div>
      </div>

      <div class="input-group">
        <label>Password</label>
        <div class="input-field">
          <i class="bi bi-lock input-icon"></i>
          <input type="password" name="Password" [(ngModel)]="signupData.Password" placeholder="Create a password"
            required minlength="8" #pwd="ngModel" />
        </div>
        @if (pwd.invalid && (pwd.dirty || pwd.touched)) {
        <div class="error-msg">
          <i class="bi bi-exclamation-circle-fill"></i> Password must be at least 8 characters long!
        </div>
        }
      </div>

      <div class="input-group">
        <label for="role">Your Role</label>
        <div class="input-field dropdown-field">
          <i class="bi bi-briefcase input-icon"></i>
          <select name="UserType" [(ngModel)]="signupData.UserType" id="role" required>
            <option value="" disabled selected hidden>Select your role</option>
            <option value="Traveller">Traveller</option>
            <option value="TransportProvider">Transport Provider</option>
          </select>
        </div>
      </div>

      <div class="form-actions">
        <label class="remember-me">
          <input type="checkbox" id="rem" />
          <span>Remember me</span>
        </label>
      </div>

      <button class="btn-login" [disabled]="pwd.invalid" (click)="onSignup()">
        <span>Let's start</span>
        <i class="bi bi-arrow-right btn-icon"></i>
      </button>

      <p class="signup-prompt">
        Already have an account?
        <a routerLink="/login">Login</a>
      </p>

    </div>
  </div>
</div>
