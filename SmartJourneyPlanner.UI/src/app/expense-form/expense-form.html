<div class="page-overlay form-background">
  <div class="bg-blob blob-top-left"></div>
  <div class="bg-blob blob-bottom-right"></div>

  <div class="form-card fade-in">

    <div class="form-header">
      <h2>{{ isEditMode ? 'Edit Expense' : 'Add New Expense' }}</h2>
      <p class="form-subtitle">
        {{ isEditMode ? 'Modifying an existing entry on this trip' : 'Adding to your currently selected trip' }}
      </p>
    </div>

    <form (ngSubmit)="onSubmit()">

      <label class="section-label">
        Select Category {{ isEditMode ? '(Locked during edit)' : '' }}
      </label>
      <div class="category-grid" [ngClass]="{'disabled-grid': isEditMode}">
        <div *ngFor="let cat of categories"
             class="cat-item"
             [class.active]="expense.category === cat.name"
             (click)="!isEditMode && selectCategory(cat.name)">
          <span class="cat-icon">{{ cat.icon }}</span>
          <span class="cat-name">{{ cat.name }}</span>
        </div>
      </div>

      <div class="input-group">
        <label class="field-label">What did you spend on?</label>
        <input type="text" 
               [(ngModel)]="expense.description" 
               name="description" 
               placeholder="e.g. Morning Coffee" 
               autocomplete="off" 
               required>
        
        <div *ngIf="expense.description && !isNoteValid(expense.description)" 
             class="validation-error">
          <i class="bi bi-exclamation-circle-fill"></i> Please enter a valid description (must contain letters).
        </div>
      </div>

      <div class="input-group">
        <label class="field-label">Amount (LKR)</label>
        <input type="number" [(ngModel)]="expense.amount" name="amount" placeholder="0.00" min="1" required>

        <div *ngIf="expense.amount !== null && expense.amount !== undefined && expense.amount <= 0" 
             class="validation-error">
          <i class="bi bi-exclamation-circle-fill"></i> Amount cannot be zero or negative.
        </div>
      </div>

      <div class="buttons">
        <button type="button" class="btn-cancel" (click)="cancel()">Cancel</button>
        
        <button type="submit" 
                class="btn-save" 
                [disabled]="expense.description && !isNoteValid(expense.description)">
          <i class="bi bi-check-circle-fill"></i> {{ isEditMode ? 'Update Expense' : 'Save Expense' }}
        </button>
      </div>

    </form>
  </div>
</div>
