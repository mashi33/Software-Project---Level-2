<div class="generation-wrapper">
  <button
    (click)="downloadPDF()"
    class="btn-download"
    [disabled]="isLoadingMap && transportMode === 'private'">

    <!-- Private — loading -->
    <ng-container *ngIf="transportMode === 'private'">
      <span class="material-icons btn-icon" *ngIf="isLoadingMap">hourglass_top</span>
      <span class="material-icons btn-icon" *ngIf="!isLoadingMap">picture_as_pdf</span>
      <span *ngIf="isLoadingMap">Preparing Map...</span>
      <span *ngIf="!isLoadingMap">Download PDF Report</span>
    </ng-container>

    <!-- Public -->
    <ng-container *ngIf="transportMode === 'public'">
      <span class="material-icons btn-icon">directions_bus</span>
      <span>Download Bus Report</span>
    </ng-container>

  </button>
</div>
