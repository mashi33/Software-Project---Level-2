<div class="login-wrapper">
  <div class="bg-overlay"></div>

  <div class="login-card">
    <div class="brand-header">

      <h2>Smart Journey Planner</h2>
      <p class="subtitle">Welcome Back! Please Sign In</p>
    </div>

    <form class="login-form" (ngSubmit)="onLogin()">

      <!-- Email Field -->
      <div class="input-group">
        <label>Email Address</label>
        <div class="input-field">
          <!-- Bootstrap Email Icon -->
          <i class="bi bi-envelope input-icon"></i>
          <input type="email" name="email" [(ngModel)]="loginData.email" placeholder="Enter your email" />
        </div>
      </div>

      <!-- Password Field -->
      <div class="input-group">
        <label>Password</label>
        <div class="input-field" style="position: relative;">
          <!-- Bootstrap Lock Icon -->
          <i class="bi bi-lock input-icon"></i>

          <!-- Password Input -->
          <input [type]="showPassword ? 'text' : 'password'" name="password" [(ngModel)]="loginData.password"
            placeholder="Enter your password" autocomplete="current-password" style="padding-right: 45px;" />

          <!-- Eye Icon for Show/Hide Password -->
          <i class="bi" [class.bi-eye]="!showPassword" [class.bi-eye-slash]="showPassword"
            (click)="showPassword = !showPassword"
            style="position: absolute; right: 16px; top: 50%; transform: translateY(-50%); cursor: pointer; color: rgba(255, 255, 255, 0.75); font-size: 18px; z-index: 10;"></i>
        </div>
      </div>

      <div class="form-actions">
        <a [routerLink]="['/forgot-password']" class="forgot-link">Forgot Password?</a>
      </div>

      <!-- Sign In Button -->
      <button class="btn-login" type="submit">
        <span>Sign In</span>
        <!-- Bootstrap Arrow Right Icon -->
        <i class="bi bi-arrow-right btn-icon"></i>
      </button>

      <p class="signup-prompt">
        Don't have an account?
        <a [routerLink]="['/signup']" [queryParams]="{
            tripId: route.snapshot.queryParamMap.get('tripId'),
            role: route.snapshot.queryParamMap.get('role')
          }">
          Sign Up
        </a>
      </p>

    </form>
  </div>
</div>
