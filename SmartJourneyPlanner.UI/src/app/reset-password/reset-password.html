<div class="reset-password-container">
    <div class="reset-password-card">
        <h2>Reset Your Password</h2>
        <p class="description">Please enter your new password below.</p>

        <div *ngIf="message" class="alert alert-success">
            {{ message }} <span>Redirecting to login...</span>
        </div>

        <div *ngIf="errorMessage" class="alert alert-danger">
            {{ errorMessage }}
        </div>

        <form *ngIf="token && !message" (ngSubmit)="onResetPassword()">
            <div class="form-group">
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" name="newPassword" [(ngModel)]="newPassword"
                    placeholder="Enter new password" required />
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" [(ngModel)]="confirmPassword"
                    placeholder="Confirm new password" required />
            </div>

            <button type="submit" class="btn-submit" [disabled]="isLoading">
                {{ isLoading ? 'Resetting...' : 'Update Password' }}
            </button>
        </form>

        <div class="back-to-login" *ngIf="!isLoading">
            <a routerLink="/login">Back to Login</a>
        </div>
    </div>
</div>
