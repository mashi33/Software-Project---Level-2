<div class="dashboard-container">
  
  <aside class="sidebar">
    <nav>
      <ul>
        <li><a class="nav-link" routerLink="/home" routerLinkActive="active">Home</a></li>
        <li><a class="nav-link" routerLink="/profile" routerLinkActive="active">Profile</a></li>
        <li><a class="nav-link" routerLink="/trip-summary" routerLinkActive="active">Trip Summary</a></li>
        <li><a class="nav-link" routerLink="/groupChat" routerLinkActive="active">Group Chat</a></li>
        <li><a class="nav-link" routerLink="/timeline" routerLinkActive="active">Timeline</a></li>
        <li><a class="nav-link" routerLink="/budget" routerLinkActive="active">Budget</a></li>
        <li><a class="nav-link" routerLink="/achievements" routerLinkActive="active">Achievements</a></li>
      </ul>
    </nav>
  </aside>

  <main class="content">
    <h1>Traveller Dashboard</h1>
    <p class="welcome">Welcome back!</p>

    <section class="weather-card">
      <div class="trip-details">
        <button class="btn-primary" (click)="navigateToWeather()">View Weather</button>
      </div>
    </section>

    <div class="dashboard-grid">
      <div class="left-col">
        <div class="stats-row">
          <div class="stat-box">
            <p>Total Upcoming Trips</p>
            
            <p class="sub-text">Planned Trips</p>
          </div>
          <div class="stat-box">
            <p>Total Completed Trips</p>
            
          </div>
        </div>

        <div class="trip-list">
          <h3>Completed Trip List</h3>
          <ol>
            <li>Nuwara Eliya</li>
            <li>Jaffna</li>
            <li>Colombo</li>
            <li>Hikkaduwa</li>
            <li>Galle</li>
            <li>Kataragama</li>
          </ol>
        </div>
      </div>

      <div class="map-section">
        <div class="map-container">
          <img src="memory.png" alt="Sri Lanka Map" (click)="navigateToMemories()">
        </div>
        <button class="btn-primary" (click)="navigateToMemories()">View All Memories</button>
      </div>
    </div>
  </main>
</div>
