<div class="forgot-password-container">
    <div class="forgot-password-card">
        <h2>Forgot Password?</h2>
        <p class="description">Enter your registered email address and we'll send you a link to reset your password.</p>

        <div *ngIf="message" class="alert alert-success">
            {{ message }}
        </div>

        <div *ngIf="errorMessage" class="alert alert-danger">
            {{ errorMessage }}
        </div>

        <form (ngSubmit)="onSendResetLink()">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" [(ngModel)]="email" placeholder="Enter your email" required
                    [disabled]="isLoading" />
            </div>

            <button type="submit" class="btn-submit" [disabled]="isLoading">
                {{ isLoading ? 'Sending Link...' : 'Send Reset Link' }}
            </button>
        </form>

        <div class="back-to-login">
            <a routerLink="/login">Back to Login</a>
        </div>
    </div>
</div>
