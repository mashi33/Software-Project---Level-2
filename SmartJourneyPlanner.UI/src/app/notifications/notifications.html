<div class="notifications-page-container container py-5">
  <div class="row justify-content-center">
    <div class="col-12">
      <div class="notifications-card shadow p-4">
        
        <!-- Header -->
        <div class="notifications-page-header d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
          <div>
            <h4 class="mb-1"><i class="bi bi-bell-fill me-2 text-primary"></i>All Notifications</h4>
            <p class="text-muted mb-0 small">Keep track of your bookings, schedules, and platform updates.</p>
          </div>
          <button class="btn btn-outline-primary btn-sm d-flex align-items-center gap-2" (click)="markAllAsRead()">
            <i class="bi bi-check2-all"></i>
            <span>Mark all as read</span>
          </button>
        </div>

        <!-- Filter Tabs -->
        <div class="filter-tabs-container mb-4">
          <button class="filter-tab" [class.active]="filterTab === 'all'" (click)="applyFilter('all')">
            All <span class="badge bg-secondary ms-1">{{ notifications.length }}</span>
          </button>
          <button class="filter-tab" [class.active]="filterTab === 'unread'" (click)="applyFilter('unread')">
            Unread <span class="badge bg-danger ms-1">{{ unreadCount }}</span>
          </button>
          <button class="filter-tab" [class.active]="filterTab === 'read'" (click)="applyFilter('read')">
            Read <span class="badge bg-success ms-1">{{ readCount }}</span>
          </button>
        </div>

        <!-- Notifications List -->
        <div class="notifications-page-list">
          <div *ngIf="filteredNotifications.length === 0" class="text-center py-5 text-muted">
            <i class="bi bi-bell-slash display-4 mb-3 d-block text-light"></i>
            <h5>No notifications found</h5>
            <p class="small">There are no notifications matching your filter criteria.</p>
          </div>

          <div *ngFor="let n of filteredNotifications" class="notification-page-item p-3 mb-3 border rounded" [class.unread]="!n.isRead" (click)="markAsRead(n)">
            <div class="d-flex gap-3">
              <div class="notification-page-icon">
                <i class="bi" [ngClass]="n.icon + ' ' + n.iconColorClass"></i>
              </div>
              <div class="notification-page-body flex-grow-1">
                <div class="d-flex justify-content-between align-items-start gap-2">
                  <h6 class="notification-page-title mb-1">{{ n.title }}</h6>
                  <span class="notification-page-time text-muted small">{{ n.time || getRelativeTime(n.createdAt) }}</span>
                </div>
                <div class="d-flex justify-content-between align-items-center mt-2">
                  <span class="unread-dot-indicator" *ngIf="!n.isRead">New Alert</span>
                  <a style="cursor: pointer;" (click)="markAsRead(n); navigateToRoute(n.route); $event.stopPropagation()" class="btn btn-sm btn-link p-0 text-decoration-none text-primary font-weight-bold">{{ n.linkText }} &rarr;</a>
                </div>
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
